name: Android CI

on:
  push:
  workflow_dispatch:
    inputs:
      guardar_capturas:
        description: "Guardar las capturas del recorrido en docs/capturas (commit en la rama)"
        type: boolean
        default: false
      entregar_apks:
        description: "Guardar las APK compiladas en dist/ (commit en la rama)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Firma release opcional: si estos secretos existen, la APK release sale firmada con la clave del proyecto.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar firma release (desde secretos)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/levantamiento-release.jks
          {
            echo "storeFile=keystore/levantamiento-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=levantamiento"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Pruebas de lógica + APK debug y release (Gradle)
        run: ./gradlew --stacktrace testDebugUnitTest assembleDebug assembleRelease

      - name: Subir APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Guardar APK en dist/ (solo ejecución manual)
        if: github.event_name == 'workflow_dispatch' && inputs.entregar_apks
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          git commit -m "APK compiladas en CI [skip ci]" || echo "Sin cambios"
          git push origin HEAD:${{ github.ref_name }}

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Criterios de aceptación en emulador (sin red) + capturas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: python3 tools/e2e/flujo_aceptacion.py app/build/outputs/apk/debug/app-debug.apk

      - name: Subir evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: evidence/

      - name: Guardar capturas en docs/capturas (solo ejecución manual)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.guardar_capturas
        run: |
          rm -rf docs/capturas && mkdir -p docs/capturas
          cp evidence/*.png docs/capturas/ || true; cp evidence/resultados.md docs/capturas/ || true
          rm -f docs/capturas/prueba_tanque.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/capturas
          git commit -m "Capturas del recorrido de aceptación en emulador [skip ci]" || echo "Sin cambios"
          git push origin HEAD:${{ github.ref_name }}
