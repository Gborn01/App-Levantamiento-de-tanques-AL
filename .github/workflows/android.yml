name: Android CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Firma release opcional: si estos secretos existen, la APK release sale firmada con la clave del proyecto.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar firma release (desde secretos)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/levantamiento-release.jks
          {
            echo "storeFile=keystore/levantamiento-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=levantamiento"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Compilar APK debug y release (Gradle)
        run: ./gradlew --stacktrace assembleDebug assembleRelease

      - name: Subir APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Criterios de aceptación en emulador (sin red) + capturas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: python3 tools/e2e/flujo_aceptacion.py app/build/outputs/apk/debug/app-debug.apk

      - name: Subir evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: evidence/
